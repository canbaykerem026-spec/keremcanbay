<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ordunuz shop</title>
    <!-- Font Awesome İkon Kütüphanesi -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* SIFIRLAMA VE TEMEL BİLGİLER */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* HEADER / NAVBAR */
        header {
            width: 100%;
            padding: 20px 8%;
            background: rgba(15, 23, 42, 0.9);
            border-bottom: 1px solid rgba(0, 240, 255, 0.2);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: 1px;
            color: #fff;
        }

        .logo span {
            color: #00f0ff;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
        }

        /* ANA İÇERİK ALANI (BOŞ ALAN) */
        main {
            flex: 1;
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            padding: 40px 20px;
        }

        /* FOOTER */
        footer {
            width: 100%;
            padding: 20px;
            text-align: center;
            background: #0f172a;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            color: #6b7280;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <!-- Header / Logo Alanı -->
    <header>
        <div class="logo">ordunuz<span>shop</span></div>
        <!-- İleride ekleyeceğin menü veya butonlar buraya gelecek -->
    </header>

    <!-- Ana İçerik Alanı -->
    <main>
        <!-- İlanlar, butonlar, modallar buraya eklenecek -->
    </main>

    <!-- Footer -->
    <footer>
        &copy; 2026 ordunuz shop. Tüm hakları saklıdır.
    </footer>

    <script>
        // İleride yazacağın JavaScript kodları buraya gelecek
    </script>
</body>
</html>
